<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Graveyard — a planner for the night shift</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      body { -webkit-font-smoothing: antialiased; }
      button { font: inherit; }

      /* ==================================================================
         Onboarding motion. Three layers that run on their own clocks:
         the sky drifts forever, the sheet rises into it once on mount,
         and the sheet's contents stagger up behind the sheet.
         Timings here are the source of truth; OUT_MS in App.jsx tracks
         .gy-out and .gy-sheet-out.
         ================================================================== */

      /* ---- the sky: a drifting dusk with two slow light blooms ---------- */
      .gy-sky {
        position: relative;
        /* contain the blooms' screen blending to this band */
        isolation: isolate;
        overflow: hidden;
        background-repeat: no-repeat;
        /* twice the band's height, so drifting the position sweeps the whole
           dusk-to-sunrise ramp through the visible slice */
        background-size: 100% 200%;
        animation: gy-drift 26s ease-in-out infinite alternate;
      }
      .gy-sky > * { position: relative; z-index: 1; }
      .gy-sky::before,
      .gy-sky::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        mix-blend-mode: screen;
        will-change: transform;
      }
      .gy-sky::before {
        left: -25%; top: -75%; width: 110%; height: 180%;
        background: radial-gradient(closest-side, var(--gy-glow) 0%, transparent 100%);
        opacity: 0.5;
        animation: gy-bloom-a 19s ease-in-out infinite alternate;
      }
      .gy-sky::after {
        right: -35%; bottom: -95%; width: 125%; height: 190%;
        background: radial-gradient(closest-side, var(--gy-warm) 0%, transparent 100%);
        opacity: 0.4;
        animation: gy-bloom-b 24s ease-in-out infinite alternate;
      }
      @keyframes gy-drift {
        from { background-position: 50% 0%; }
        to   { background-position: 50% 100%; }
      }
      @keyframes gy-bloom-a {
        from { transform: translate3d(-7%, -5%, 0) scale(1); }
        to   { transform: translate3d(9%, 9%, 0) scale(1.3); }
      }
      @keyframes gy-bloom-b {
        from { transform: translate3d(7%, 8%, 0) scale(1.15); }
        to   { transform: translate3d(-9%, -7%, 0) scale(1.4); }
      }

      /* ---- the sheet: rises from below, arc deepens then settles -------- */
      .gy-sheet { animation: gy-sheet-in 780ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes gy-sheet-in {
        from { transform: translateY(110px); border-radius: 50% 50% 0 0 / 108px 108px 0 0; }
        55%  { border-radius: 50% 50% 0 0 / 26px 26px 0 0; }
        to   { transform: translateY(0); }
      }

      /* ---- hero furniture arrives above the sheet, then breathes -------- */
      .gy-hero { animation: gy-hero-in 620ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes gy-hero-in { from { opacity: 0; transform: translateY(-16px); } }

      .gy-badge {
        animation:
          gy-badge-in 760ms cubic-bezier(0.34, 1.56, 0.64, 1) 110ms both,
          gy-float 5.5s ease-in-out 880ms infinite alternate;
      }
      @keyframes gy-badge-in { from { opacity: 0; transform: scale(0.55) translateY(26px); } }
      @keyframes gy-float { from { transform: translateY(0); } to { transform: translateY(-9px); } }

      /* ---- staggered content: each child follows the one above it ------- */
      .gy-stagger > * { animation: gy-rise 620ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      .gy-stagger > *:nth-child(1) { animation-delay: 180ms; }
      .gy-stagger > *:nth-child(2) { animation-delay: 245ms; }
      .gy-stagger > *:nth-child(3) { animation-delay: 310ms; }
      .gy-stagger > *:nth-child(4) { animation-delay: 375ms; }
      .gy-stagger > *:nth-child(5) { animation-delay: 440ms; }
      .gy-stagger > *:nth-child(6) { animation-delay: 505ms; }
      .gy-stagger > *:nth-child(7) { animation-delay: 570ms; }
      .gy-stagger > *:nth-child(n + 8) { animation-delay: 630ms; }
      @keyframes gy-rise { from { transform: translateY(18px); } }

      /* Steps inside a screen are quicker: the sheet is already up, only
         its contents change. */
      .gy-step > * { animation: gy-rise 480ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      .gy-step > *:nth-child(1) { animation-delay: 0ms; }
      .gy-step > *:nth-child(2) { animation-delay: 55ms; }
      .gy-step > *:nth-child(n + 3) { animation-delay: 110ms; }

      /* A list inside a step cascades row by row. Descendant selector on
         purpose: when the step class flips back in, this starts matching
         again, which is what replays the cascade without remounting rows. */
      .gy-step .gy-list > * { animation: gy-rise 460ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      .gy-step .gy-list > *:nth-child(1) { animation-delay: 90ms; }
      .gy-step .gy-list > *:nth-child(2) { animation-delay: 135ms; }
      .gy-step .gy-list > *:nth-child(3) { animation-delay: 180ms; }
      .gy-step .gy-list > *:nth-child(4) { animation-delay: 225ms; }
      .gy-step .gy-list > *:nth-child(5) { animation-delay: 270ms; }
      .gy-step .gy-list > *:nth-child(6) { animation-delay: 315ms; }
      .gy-step .gy-list > *:nth-child(n + 7) { animation-delay: 360ms; }

      /* Placeholders are the one text colour the theme cannot reach inline,
         so the field passes its own token down and this reads it. Without the
         opacity reset Firefox dims it below the contrast floor. */
      input::placeholder { color: var(--gy-placeholder, #6F6B63); opacity: 1; }

      .gy-step-out { animation: gy-step-out 190ms ease-in both; }
      @keyframes gy-step-out { to { opacity: 0; transform: translateY(-14px); } }

      /* ---- screen swap: container fades, sheet drops back out ---------- */
      .gy-in  { animation: gy-fade-in 320ms ease-out both; }
      .gy-out { animation: gy-fade-out 300ms cubic-bezier(0.5, 0, 0.75, 0) both; }
      .gy-out .gy-sheet { animation: gy-sheet-out 300ms cubic-bezier(0.5, 0, 0.75, 0) both; }
      .gy-out .gy-sky   { animation: gy-sky-out 300ms ease-in both; }
      @keyframes gy-fade-in  { from { opacity: 0; } }
      @keyframes gy-fade-out { to { opacity: 0; transform: translateY(10px); } }
      @keyframes gy-sheet-out { to { transform: translateY(64px); border-radius: 50% 50% 0 0 / 76px 76px 0 0; } }
      @keyframes gy-sky-out { to { opacity: 0.35; transform: scale(1.04); } }

      /* ---- touch feedback ---------------------------------------------- */
      .gy-tap { transition: transform 160ms cubic-bezier(0.2, 0, 0.2, 1); }
      .gy-tap:active { transform: scale(0.968); }
      .gy-spin { animation: gy-spin 900ms linear infinite; }
      @keyframes gy-spin { to { transform: rotate(360deg); } }

      .gy-pop { animation: gy-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
      @keyframes gy-pop {
        0%   { transform: scale(0.3); }
        60%  { transform: scale(1.18); }
        100% { transform: scale(1); }
      }

      /* ---- focus ------------------------------------------------------- */
      /* :focus-visible, not :focus, so a finger never lights this up — only a
         keyboard, Switch Control or Full Keyboard Access.
         Two tones because no single one survives every background here: the
         warm page, the dark page, the hero band and the dusk gradient. One of
         the two always contrasts. Neither comes from tokens.js on purpose —
         the ring has to outlive a palette rework it knows nothing about.
         outline and box-shadow both follow border-radius, so a 999px pill
         gets a pill and not a box around it.
         !important on the shadow alone: the one focusable element that sets
         boxShadow inline would otherwise win and keep only half the ring. */
      :focus-visible {
        outline: 2px solid #0A0A0C;
        outline-offset: 2px;
        box-shadow: 0 0 0 2px #FFFFFF !important;
      }

      /* A guided care session is instruction; the dusk drifting behind it is
         decoration competing for the same attention. Same selector list as the
         reduced-motion block below, switched on from App while `playing` holds
         an activity. The sky only: the sheet and the badge have long settled by
         then, and the player's own breathing circle is the instruction. */
      .gy-hushed .gy-sky,
      .gy-hushed .gy-sky::before,
      .gy-hushed .gy-sky::after { animation: none !important; }

      @media (prefers-reduced-motion: reduce) {
        .gy-sky, .gy-sky::before, .gy-sky::after, .gy-badge, .gy-spin { animation: none !important; }
        .gy-in, .gy-out, .gy-sheet, .gy-hero, .gy-step-out, .gy-pop,
        .gy-stagger > *, .gy-step > *, .gy-step .gy-list > *,
        .gy-out .gy-sheet, .gy-out .gy-sky {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
        }
        * { transition-duration: 1ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Where the app just took you. It lives out here rather than in the tree
         because every screen mounts its own, and a live region that arrives
         together with its text is not reliably announced; App writes into it on
         every screen and tab change. Clipped, not display:none — a hidden
         region is not read at all. -->
    <div id="gy-where" role="status" aria-live="polite"
         style="position: absolute; width: 1px; height: 1px; overflow: hidden;
                clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
